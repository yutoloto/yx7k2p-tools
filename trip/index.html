<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅のしおり</title>
<link rel="manifest" href="manifest.json">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅のしおり">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --canvas:#ffffff; --ash:#efefef; --ash2:#e6e6e6;
  --ink:#202020; --steel:#4d4d4d; --mute:#8a8a8a;
  --rule:#dcdcdc; --accent:#ff682c; --brass:#816729;
  --on-ink:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{
    --canvas:#0d0d0d; --ash:#191919; --ash2:#232323;
    --ink:#f0f0f0; --steel:#a8a8a8; --mute:#767676;
    --rule:#2b2b2b; --accent:#ff7d47; --brass:#c9a24d;
    --on-ink:#0d0d0d;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--canvas);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  font-size:16px;line-height:1.5;font-weight:400;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
input,select,textarea,button{font-family:inherit;font-size:16px;color:var(--ink)}
input[type=number]{-moz-appearance:textfield}
input[type=checkbox]{accent-color:var(--accent)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
button{cursor:pointer;background:none;border:none}
svg{display:block}

/* ── タイポ階層 ── */
.display{font-size:44px;line-height:.95;letter-spacing:-.02em;font-weight:400;font-variant-numeric:tabular-nums}
.h-lg{font-size:28px;line-height:1.15;letter-spacing:-.02em;font-weight:500}
.h{font-size:20px;line-height:1.2;letter-spacing:-.02em;font-weight:600}
.cap{font-size:14px;line-height:1.43;font-weight:500;color:var(--steel)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.accent{color:var(--accent)}

/* ── 骨格 ── */
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.page{display:none}
.page.active{display:block}
header{position:sticky;top:0;z-index:50;background:var(--canvas);border-bottom:1px solid var(--rule)}
.hbar{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.hbar .nm{flex:1;min-width:0;text-align:left}
.hbar .nm b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .nm span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.hbar .nm b::after{content:"▾";color:var(--mute);font-size:12px;margin-left:6px;vertical-align:1px}
.sect{margin-top:36px}
.sect:first-child{margin-top:20px}
.sect>.lbl{margin-bottom:12px}
.rule{height:1px;background:var(--rule);margin:20px 0}

/* ── 面 ── */
.card{background:var(--ash);border-radius:8px;padding:16px}
.hero{background:var(--ash);border-radius:6px 0 0 0;padding:20px}
.tile{background:var(--ash);border-radius:8px;padding:14px 16px}
.list-row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--rule)}

/* ── ボタン（accentは使わない） ── */
.btn{background:var(--ink);color:var(--on-ink);border-radius:0;padding:14px 18px;font-size:16px;font-weight:500;letter-spacing:-.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.out{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--steel);border:1px solid var(--rule)}
.btn.sm{padding:9px 14px;font-size:14px}
.btn.wide{width:100%}
.btn.danger{background:transparent;color:#b3261e;border:1px solid #b3261e}
@media (prefers-color-scheme:dark){.btn.danger{color:#ff8a80;border-color:#ff8a80}}

/* ── 入力 ── */
.fld{margin-bottom:16px}
.fld>.lbl{display:block;margin-bottom:6px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--canvas);border:1px solid var(--rule);border-radius:0;
  padding:12px;line-height:1.4}
textarea{min-height:88px;resize:vertical;line-height:1.7}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;background-size:5px 5px;background-repeat:no-repeat}

/* ── いま ── */
.now-time{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.now-time .t{font-size:56px;line-height:.9;font-weight:400;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.now-time .d{font-size:13px;color:var(--steel);font-weight:500}
.stat{display:flex;gap:8px;margin-top:12px}
.stat>button{flex:1;background:var(--ash);border-radius:8px;padding:12px 14px;text-align:left}
.stat .v{font-size:22px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.next-in{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.keyline{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.keyline:last-child{border-bottom:none}
.keyline .kt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--brass);min-width:44px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent);padding:1px 6px;border-radius:2px;vertical-align:2px;margin-left:8px}
.tag.brass{color:var(--brass);border-color:var(--brass)}

/* ── 行程（レール） ── */
.daytabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.daytabs button{flex-shrink:0;border-radius:200px;padding:8px 16px;font-size:14px;font-weight:500;background:var(--ash);color:var(--steel)}
.daytabs button.on{background:var(--ink);color:var(--on-ink)}
.rail{position:relative;padding-left:76px}
.rail::before{content:"";position:absolute;left:60px;top:8px;bottom:8px;width:1px;background:var(--rule)}
.ev{position:relative;padding:14px 0;border-bottom:1px solid var(--rule);width:100%;text-align:left;display:block}
.ev:last-of-type{border-bottom:none}
.ev .et{position:absolute;left:-76px;top:16px;width:48px;text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ev .dot{position:absolute;left:-19px;top:20px;width:7px;height:7px;border-radius:50%;background:var(--rule);border:1px solid var(--canvas)}
.ev .ttl{font-size:16px;font-weight:500;line-height:1.4}
.ev .note{font-size:14px;line-height:1.6;color:var(--steel);margin-top:4px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev .meta{font-size:12px;color:var(--mute);margin-top:6px}
.ev.past .et,.ev.past .ttl{color:var(--mute)}
.ev.past .note{color:var(--mute)}
.ev.key .dot{background:var(--accent);border-color:var(--accent)}
.ev.key .et{color:var(--accent)}
.ev.cur .dot{background:var(--accent);width:11px;height:11px;left:-21px;top:18px;border-color:var(--accent)}
.nowline{position:relative;height:1px;background:var(--accent);margin:2px 0}
.nowline span{position:absolute;left:-76px;top:-8px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--accent);background:var(--canvas);padding-right:6px}

/* ── 持ちもの ── */
.prog{height:2px;background:var(--rule);margin:10px 0 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .35s}
.ck{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--rule)}
.ck .box{width:22px;height:22px;border:1px solid var(--ink);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.ck .box svg{opacity:0}
.ck.done .box{background:var(--ink)}
.ck.done .box svg{opacity:1;stroke:var(--on-ink)}
.ck .tx{flex:1;font-size:16px;line-height:1.45}
.ck.done .tx{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1px}

/* ── お金 ── */
.settle{padding:16px 0;border-bottom:1px solid var(--rule)}
.settle:last-child{border-bottom:none}
.settle .who{font-size:14px;color:var(--steel);font-weight:500}
.settle .amt{font-size:34px;font-weight:400;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:2px}
.exp{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--rule)}
.exp .n{flex:1;min-width:0;font-size:16px;font-weight:500}
.exp .s{display:block;font-size:12px;color:var(--mute);margin-top:3px;font-weight:400}
.exp .a{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.pp{display:inline-flex;align-items:center;gap:8px;background:var(--ash);border-radius:200px;padding:7px 8px 7px 14px;font-size:14px;font-weight:500}
.pp .x{color:var(--mute);font-size:16px;line-height:1;padding:0 4px}
.billout{background:var(--ash);border-radius:8px;padding:16px;font-size:15px;line-height:1.9;white-space:pre-wrap;font-variant-numeric:tabular-nums}
details{border-top:1px solid var(--rule);padding:14px 0}
summary{list-style:none;cursor:pointer;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--mute);font-size:15px}
details[open] summary::after{content:"−"}
details>div{padding-top:16px}

/* ── ナビ ── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--canvas);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:560px;margin:0 auto;display:flex;padding:8px 10px 10px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:10px;font-weight:600;letter-spacing:.02em;padding:6px 0;border-radius:200px;position:relative}
nav button.on{color:var(--ink);background:var(--ash)}
nav button .bdg{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:200px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ── シート ── */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-in{background:var(--canvas);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:8px 8px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet-in h3{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:16px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.empty{padding:40px 0;text-align:center;color:var(--mute);font-size:14px;line-height:1.9}
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:11px 20px;border-radius:200px;font-size:14px;font-weight:500;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<header><div class="hbar">
  <button class="nm" onclick="openTrips()"><b id="hd-name">旅のしおり</b><span id="hd-sub">旅を作ってください</span></button>
  <button class="btn out sm" onclick="openTrips()">切替</button>
</div></header>

<div class="page active" id="p-home"><div class="wrap" id="home-body"></div></div>
<div class="page" id="p-plan"><div class="wrap" id="plan-body"></div></div>
<div class="page" id="p-check"><div class="wrap" id="check-body"></div></div>
<div class="page" id="p-money"><div class="wrap" id="money-body"></div></div>
<div class="page" id="p-memo"><div class="wrap" id="memo-body"></div></div>

<nav><div class="navin" id="nav"></div></nav>
<div class="sheet" id="sheet"><div class="sheet-in" id="sheet-in"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY='trip_db_v1';
let DB={trips:[],cur:null};
let PAGE='home', curDay=1, ckEdit=false, ckHideDone=false;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const WD=['日','月','火','水','木','金','土'];

const ICON={
  home:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  plan:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 4v16"/><circle cx="6" cy="8" r="2"/><circle cx="6" cy="16" r="2"/><path d="M11 8h8M11 16h6"/></svg>',
  check:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>',
  money:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/></svg>',
  memo:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4h14v16H5z"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/></svg>',
  tick:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'
};
const TABS=[['home','いま'],['plan','行程'],['check','持ちもの'],['money','お金'],['memo','メモ']];

function load(){try{const r=localStorage.getItem(KEY);if(r)DB=JSON.parse(r);}catch(e){}
  if(!DB.trips)DB.trips=[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('保存できません');}}
function trip(){return DB.trips.find(t=>t.id===DB.cur)||null;}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove('on'),1800);}
function openSheet(html){$('sheet-in').innerHTML=html;$('sheet').classList.add('on');}
function closeSheet(){$('sheet').classList.remove('on');}
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});

/* ═══ 日付 ═══ */
function dayDate(t,day){const d=new Date((t.start||'2000-01-01')+'T00:00:00');d.setDate(d.getDate()+(day-1));return d;}
function evAt(t,e){const d=dayDate(t,e.day||1);if(e.time){const p=e.time.split(':');d.setHours(+p[0]||0,+p[1]||0,0,0);}return d;}
function fmtMD(d){return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';}
function midnight(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
function todayIdx(t){const n=Math.round((midnight(new Date())-midnight(dayDate(t,1)))/86400000)+1;return n;}
function phaseOf(t){const i=todayIdx(t);return i<1?'before':(i>t.days?'after':'during');}
function untilText(ms){
  const m=Math.round(ms/60000);
  if(m<=0)return'まもなく';
  if(m<60)return'あと'+m+'分';
  const h=Math.floor(m/60);
  if(h<24)return'あと'+h+'時間'+(m%60?(m%60)+'分':'');
  return'あと'+Math.floor(h/24)+'日';
}
function sortedEvents(t){return t.events.slice().sort((a,b)=>evAt(t,a)-evAt(t,b));}
function nowNext(t){
  const now=Date.now();let cur=null,next=null;
  for(const e of sortedEvents(t)){
    if(evAt(t,e).getTime()<=now)cur=e;else{next=e;break;}
  }
  return{cur,next};
}

/* ═══ ページ切替 ═══ */
function go(p){
  if(p!=='home'&&!trip()){openTrips();return;}
  PAGE=p;
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  $('p-'+p).classList.add('active');
  render();window.scrollTo(0,0);
}
function renderNav(){
  const t=trip();
  const left=t?t.checks.filter(c=>!c.done).length:0;
  $('nav').innerHTML=TABS.map(([k,label])=>
    `<button class="${PAGE===k?'on':''}" onclick="go('${k}')">${ICON[k]}${label}${
      k==='check'&&left?`<span class="bdg">${left}</span>`:''}</button>`).join('');
}
function renderHeader(){
  const t=trip();
  if(!t){$('hd-name').textContent='旅のしおり';$('hd-sub').textContent='旅を作ってください';return;}
  $('hd-name').textContent=t.name;
  const i=todayIdx(t),ph=phaseOf(t);
  $('hd-sub').textContent=ph==='during'?(i+'日目 / 全'+t.days+'日')
    :ph==='before'?fmtMD(dayDate(t,1))+'から'+t.days+'日'
    :'終了 / '+fmtMD(dayDate(t,1))+'〜';
}

/* ═══ いま ═══ */
function renderHome(){
  const t=trip();const el=$('home-body');
  if(!t){
    el.innerHTML=`<div class="sect"><div class="hero">
      <div class="lbl" style="margin-bottom:10px">はじめに</div>
      <div class="h-lg">旅をひとつ作ると<br>すべてが動きます</div>
      <p class="cap" style="margin-top:12px">行程・持ちもの・立替の精算をこの中にまとめます。データは端末の中だけに保存されます。</p>
      <button class="btn wide" style="margin-top:20px" onclick="newTrip()">最初の旅を作る</button>
    </div></div>
    ${DB.trips.length?'':''}
    <div class="sect"><div class="lbl">データ</div>
      <button class="btn ghost wide" onclick="importAll()">バックアップから読み込む</button></div>`;
    return;
  }
  const now=new Date();const ph=phaseOf(t);
  let html=`<div class="sect"><div class="now-time">
    <div class="t">${pad(now.getHours())}:${pad(now.getMinutes())}</div>
    <div class="d">${fmtMD(now)}</div></div>`;

  if(ph==='before'){
    const dep=sortedEvents(t)[0];
    const depAt=dep?evAt(t,dep):dayDate(t,1);
    const days=Math.ceil((midnight(depAt)-midnight(now))/86400000);
    const left=t.checks.filter(c=>!c.done).length;
    html+=`<p class="cap">出発まで <span class="next-in">${days<=0?untilText(depAt-now):'あと'+days+'日'}</span></p></div>
    <div class="sect"><div class="hero">
      <div class="lbl" style="margin-bottom:10px">準備</div>
      ${t.checks.length?`<div class="h-lg">${left?'持ちものが残り'+left+'件':'持ちものは全部そろいました'}</div>
      <div class="prog"><i style="width:${t.checks.length?(t.checks.length-left)/t.checks.length*100:0}%"></i></div>
      ${t.checks.filter(c=>!c.done).slice(0,4).map(c=>
        `<button class="ck" onclick="toggleCheck('${c.id}')"><span class="box">${ICON.tick}</span><span class="tx">${esc(c.text)}</span></button>`).join('')}
      <button class="btn out wide sm" style="margin-top:14px" onclick="go('check')">持ちものを全部見る</button>`
      :`<div class="h-lg">持ちものを書き出す</div>
      <p class="cap" style="margin-top:10px">当日に思い出すのは無理です。今のうちに入れておくと、出発前にここで消し込めます。</p>
      <button class="btn wide" style="margin-top:16px" onclick="go('check')">持ちものを追加する</button>`}
    </div></div>`;
    if(dep)html+=`<div class="sect"><div class="lbl">出発</div><div class="tile">
      <div class="h">${esc(dep.time||'')} ${esc(dep.title)}</div>
      <p class="cap" style="margin-top:6px">${fmtMD(depAt)}</p></div></div>`;
  }

  if(ph==='during'){
    const nn=nowNext(t);
    html+=`<p class="cap">${todayIdx(t)}日目</p></div>`;
    if(nn.next){
      const ms=evAt(t,nn.next)-now;

function renderPlan(){
  const t=trip();if(!t)return;
  const ti=todayIdx(t);
  if(!renderPlan._init){curDay=Math.min(Math.max(ti,1),t.days);renderPlan._init=1;}
  const now=new Date();
  const tabs=Array.from({length:t.days},(_,i)=>
    `<button class="${curDay===i+1?'on':''}" onclick="curDay=${i+1};render()">${i+1}日目 ${fmtMD(dayDate(t,i+1))}</button>`).join('');
  const evs=t.events.filter(e=>(e.day||1)===curDay).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  const nn=nowNext(t);
  let rows='',lineDone=curDay!==ti;
  evs.forEach(e=>{
    const at=evAt(t,e),past=at<now;
    if(!lineDone&&!past){rows+='<div class="nowline"><span>いま</span></div>';lineDone=true;}
    rows+=`<button class="ev ${past?'past':''} ${e.key?'key':''} ${nn.cur&&nn.cur.id===e.id?'cur':''}" onclick="openEv('${e.id}')">
      <span class="et">${esc(e.time||'—')}</span><span class="dot"></span>

      ${e.url?'<span class="meta">リンクあり</span>':''}

  $('plan-body').innerHTML=`
    <div class="sect" style="margin-top:12px"><div class="daytabs">${tabs}</div>

/* ═══ お金 ═══ */
function calcBalance(){
  const t=trip(),bal={};
  t.people.forEach(p=>bal[p]=0);
  t.expenses.forEach(e=>{
    if(bal[e.payer]===undefined)bal[e.payer]=0;
    bal[e.payer]+=e.amount;
    const each=e.amount/e.split.length;
    e.split.forEach(p=>{if(bal[p]===undefined)bal[p]=0;bal[p]-=each;});
  });
  return bal;
}
function settlements(){
  const bal=calcBalance(),cred=[],debt=[];
  Object.entries(bal).forEach(([p,v])=>{if(v>0.5)cred.push({p,v});else if(v<-0.5)debt.push({p,v:-v});});
  cred.sort((a,b)=>b.v-a.v);debt.sort((a,b)=>b.v-a.v);
  const out=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const amt=Math.min(debt[i].v,cred[j].v);
    out.push({from:debt[i].p,to:cred[j].p,amt});
    debt[i].v-=amt;cred[j].v-=amt;
    if(debt[i].v<0.5)i++;
    if(cred[j].v<0.5)j++;
  }
  return out;
}

function renderBill(){
  const t=trip();if(!t||!$('bill-out'))return;
  const target=$('bill-target')?$('bill-target').value:'';
  const round=parseInt($('bill-round')?$('bill-round').value:'1')||1;
  const lines=[];let sum=0;
  t.expenses.forEach(e=>{
    if(!e.split.includes(target))return;
    const share=e.amount/e.split.length;
    sum+=share;
    lines.push(e.name+'　'+Math.round(share).toLocaleString('ja-JP')+'円');
  });
  if(!lines.length){$('bill-out').textContent='—';return;}
  const totalOut=round>1?Math.floor(sum/round)*round:Math.round(sum);
  $('bill-out').textContent=lines.join('\n')+'\n\n合計　'+totalOut.toLocaleString('ja-JP')+'円';
}
function copyBill(){
  const txt=$('bill-out').textContent;
  if(!txt||txt==='—'){toast('内容がありません');return;}
  navigator.clipboard.writeText(txt).then(()=>toast('コピーしました'),()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');ta.remove();toast('コピーしました');});
}

  <div class="row"><div class="fld"><span class="lbl">開始日</span><input type="date" id="f-start" value="${today}"></div>
  <div class="fld" style="max-width:110px"><span class="lbl">日数</span><input type="number" id="f-days" value="2" min="1" max="30"></div></div>
  <div class="fld"><span class="lbl">メンバー（カンマ区切り）</span><input type="text" id="f-people" placeholder="自分, 相方"></div>
  <div class="row"><button class="btn ghost" onclick="closeSheet()">やめる</button>
  <button class="btn" onclick="createTrip()">作る</button></div>`);
}
function createTrip(){
  const name=$('f-name').value.trim()||'新しい旅';
  const start=$('f-start').value||new Date().toISOString().slice(0,10);
  const days=Math.max(1,parseInt($('f-days').value)||1);
  const ppl=$('f-people').value.split(',').map(s=>s.trim()).filter(Boolean);
  DB.trips.unshift({id:uid(),name,start,days,people:ppl.length?ppl:['自分'],events:[],checks:[],expenses:[],memo:''});
  DB.cur=DB.trips[0].id;renderPlan._init=0;save();closeSheet();go('home');
}
function openTrip(id){DB.cur=id;renderPlan._init=0;save();closeSheet();go('home');}
function delTrip(id){
  const t=DB.trips.find(x=>x.id===id);if(!t)return;
  if(!confirm('「'+t.name+'」を削除します。よろしいですか？'))return;
  DB.trips=DB.trips.filter(x=>x.id!==id);
  if(DB.cur===id)DB.cur=DB.trips.length?DB.trips[0].id:null;
  save();closeSheet();render();
  if(DB.trips.length)openTrips();
}

/* ═══ 書き出し / 読み込み ═══ */
function exportAll(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='tabi-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();toast('書き出しました');
}
function importAll(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      if(!d.trips)throw 0;
      if(!confirm('いまのデータを置き換えます。よろしいですか？'))return;
      DB=d;save();closeSheet();render();toast('読み込みました');
    }catch(e){toast('読み込めませんでした');}};
    r.readAsText(f);};
  i.click();
}

/* ═══ リンクからの取り込み ═══ */
function b64ToUtf8(x){
  const bin=atob(x.replace(/-/g,'+').replace(/_/g,'/'));
  return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
}
async function importFromLinkZ(){
  const h=location.hash||'';
  if(h.indexOf('#z=')!==0)return false;
  let json;
  try{
    const bin=atob(decodeURIComponent(h.slice(3)).replace(/-/g,'+').replace(/_/g,'/'));
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const ds=new DecompressionStream('deflate-raw');
    const buf=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
    json=new TextDecoder().decode(buf);
  }catch(e){toast('リンクを読めませんでした');history.replaceState(null,'',location.pathname);return false;}
  return applyImport(JSON.parse(json));
}
function importFromLink(){
  const h=location.hash||'';
  if(h.indexOf('#import=')!==0)return false;
  let data;
  try{data=JSON.parse(b64ToUtf8(decodeURIComponent(h.slice(8))));}
  catch(e){toast('リンクを読めませんでした');history.replaceState(null,'',location.pathname);return false;}
  return applyImport(data);
}
function applyImport(data){
  const list=Array.isArray(data)?data:(data.trips||[data]);
  if(!list.length){history.replaceState(null,'',location.pathname);return false;}
  const names=list.map(t=>t.name||'名前なし').join('、');
  if(!confirm('「'+names+'」を追加します。よろしいですか？')){
    history.replaceState(null,'',location.pathname);return false;
  }
  list.forEach(t=>{
    t.id=uid();
    t.events=t.events||[];t.checks=t.checks||[];t.expenses=t.expenses||[];
    t.people=t.people||['自分'];t.memo=t.memo||'';
    t.events.forEach(e=>{if(!e.id)e.id=uid();});
    t.checks.forEach(c=>{if(!c.id)c.id=uid();});
    t.expenses.forEach(x=>{if(!x.id)x.id=uid();});
    DB.trips.unshift(t);
  });
  DB.cur=DB.trips[0].id;renderPlan._init=0;
  save();
  history.replaceState(null,'',location.pathname);
  toast('追加しました');
  return true;
}

/* ═══ 起動 ═══ */
function render(){
  renderHeader();renderNav();
  if(PAGE==='home')renderHome();
  else if(PAGE==='plan')renderPlan();
  else if(PAGE==='check')renderCheck();
  else if(PAGE==='money')renderMoney();
  else if(PAGE==='memo')renderMemo();
}
load();
if(!importFromLink()){importFromLinkZ().then(ok=>{if(ok)render();});}
render();
setInterval(()=>{if(PAGE==='home'||PAGE==='plan')render();},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
